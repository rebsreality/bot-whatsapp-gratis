services:
  - type: web
    name: bot-whatsapp-gratis
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: HISTORY_LIMIT
        value: "8"
      # O Render vai pedir estes 4 valores na criação:
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # Opcionais (adicione depois em Environment): WHATSAPP_APP_SECRET,
      # UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
